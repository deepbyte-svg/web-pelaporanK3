<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Selamat K3</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    />
    <style>
      /* Layout: sticky pill navigation over a single flowing column of rounded surfaces, green on white, no square corners anywhere. */
      :root {
        --bg: #ffffff;
        --surface: #f3faf5;
        --surface-2: #e4f3e9;
        --fg: #12301f;
        --muted: #547060;
        --line: #d3e7da;
        --green: #178347;
        --green-d: #0f5f33;
        --green-l: #d2eedc;
        --on-green: #ffffff;
        --link: #0f5f33;
        --ring: #2ba862;
        --bad-bg: #fde9e6;
        --bad-fg: #a3281b;
        --warn-bg: #fff1d6;
        --warn-fg: #8a5a00;
        --info-bg: #e3eefb;
        --info-fg: #1f559a;
        --ok-bg: #d8f2e1;
        --ok-fg: #14703c;
        --overlay: rgba(10, 30, 18, 0.45);
        --shadow: 0 10px 32px rgba(15, 95, 51, 0.1);
        --f-display: "Bricolage Grotesque", system-ui, sans-serif;
        --f-body: "Plus Jakarta Sans", system-ui, sans-serif;
        --f-mono: "JetBrains Mono", ui-monospace, monospace;
        --r-s: 14px;
        --r-m: 20px;
        --r-l: 28px;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1a13;
          --surface: #14241a;
          --surface-2: #1b3125;
          --fg: #e6f3ea;
          --muted: #9db8a8;
          --line: #264233;
          --green: #2fa865;
          --green-d: #3fbf76;
          --green-l: #1f3a2b;
          --on-green: #04200e;
          --link: #7fe0a8;
          --ring: #5bd08e;
          --bad-bg: #4a2420;
          --bad-fg: #ffb4a8;
          --warn-bg: #46361a;
          --warn-fg: #f5cb7a;
          --info-bg: #1e3250;
          --info-fg: #a9cbf5;
          --ok-bg: #1c4430;
          --ok-fg: #8ee0ae;
          --overlay: rgba(0, 0, 0, 0.6);
          --shadow: none;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1a13;
        --surface: #14241a;
        --surface-2: #1b3125;
        --fg: #e6f3ea;
        --muted: #9db8a8;
        --line: #264233;
        --green: #2fa865;
        --green-d: #3fbf76;
        --green-l: #1f3a2b;
        --on-green: #04200e;
        --link: #7fe0a8;
        --ring: #5bd08e;
        --bad-bg: #4a2420;
        --bad-fg: #ffb4a8;
        --warn-bg: #46361a;
        --warn-fg: #f5cb7a;
        --info-bg: #1e3250;
        --info-fg: #a9cbf5;
        --ok-bg: #1c4430;
        --ok-fg: #8ee0ae;
        --overlay: rgba(0, 0, 0, 0.6);
        --shadow: none;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 400 16px/1.6 var(--f-body);
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 0 32px;
        min-height: 100%;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 30;
        background: var(--bg);
      }
      h1,
      h2,
      h3 {
        font-family: var(--f-display);
        line-height: 1.15;
        margin: 0;
        text-wrap: balance;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: clamp(2.1rem, 5.4vw, 3.5rem);
      }
      h2 {
        font-size: clamp(1.5rem, 3.4vw, 2.1rem);
      }
      h3 {
        font-size: 1.2rem;
      }
      p {
        margin: 0;
      }
      a {
        color: var(--link);
      }
      .wrap {
        max-width: 1120px;
        margin-inline: auto;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--link);
      }
      .mono {
        font-family: var(--f-mono);
        font-size: 0.8rem;
        color: var(--muted);
      }
      :focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 3px;
      }

      /* header */
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 20;
        background: var(--bg);
        padding-block: 14px 12px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--fg);
        font: 700 1.25rem var(--f-display);
        margin-right: auto;
      }
      .nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 5px;
        background: var(--surface);
        border-radius: 999px;
        border: 1px solid var(--line);
        max-width: 100%;
        scrollbar-width: none;
      }
      .nav::-webkit-scrollbar {
        display: none;
      }
      .nav a {
        white-space: nowrap;
        padding: 8px 16px;
        border-radius: 999px;
        text-decoration: none;
        color: var(--muted);
        font-weight: 600;
        font-size: 0.92rem;
      }
      .nav a:hover {
        color: var(--fg);
      }
      .nav a.on {
        background: var(--green);
        color: var(--on-green);
      }
      .acct {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
        line-height: 1.2;
      }
      .who-t {
        display: flex;
        flex-direction: column;
        font-size: 0.85rem;
      }
      .who-t small {
        color: var(--muted);
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--green-l);
        color: var(--link);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 0.85rem;
      }
      @media (max-width: 760px) {
        .nav {
          order: 3;
          width: 100%;
        }
        .who-t {
          display: none;
        }
      }

      /* controls */
      .btn {
        font: 600 0.95rem var(--f-body);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 999px;
        border: 1.5px solid var(--green);
        background: var(--green);
        color: var(--on-green);
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn:hover {
        background: var(--green-d);
        border-color: var(--green-d);
      }
      .btn.ghost {
        background: transparent;
        color: var(--link);
      }
      .btn.ghost:hover {
        background: var(--green-l);
      }
      .btn.sm {
        padding: 8px 16px;
        font-size: 0.85rem;
      }
      .btn[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        font-size: 1.3rem;
        line-height: 1;
        cursor: pointer;
      }
      .icon-btn:hover {
        background: var(--green-l);
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        font: 600 0.88rem var(--f-body);
        padding: 9px 16px;
        border-radius: 999px;
        border: 1.5px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      .chip:hover {
        background: var(--surface-2);
      }
      .chip.on {
        background: var(--green);
        border-color: var(--green);
        color: var(--on-green);
      }
      .chip small {
        opacity: 0.75;
        margin-left: 4px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .field > label,
      .lbl {
        font-weight: 600;
        font-size: 0.86rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        font: inherit;
        padding: 12px 16px;
        border-radius: 16px;
        border: 1.5px solid var(--line);
        background: var(--bg);
        color: var(--fg);
      }
      textarea {
        min-height: 112px;
        resize: vertical;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 3px solid var(--ring);
        outline-offset: 1px;
        border-color: var(--green);
      }
      .hint {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .err {
        font-size: 0.85rem;
        color: var(--bad-fg);
        background: var(--bad-bg);
        padding: 10px 14px;
        border-radius: 14px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 3px 12px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .p-bad {
        background: var(--bad-bg);
        color: var(--bad-fg);
      }
      .p-warn {
        background: var(--warn-bg);
        color: var(--warn-fg);
      }
      .p-info {
        background: var(--info-bg);
        color: var(--info-fg);
      }
      .p-ok {
        background: var(--ok-bg);
        color: var(--ok-fg);
      }
      .p-mute {
        background: var(--surface-2);
        color: var(--muted);
      }

      /* surfaces */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-l);
        padding: 24px;
        min-width: 0;
      }
      .card.plain {
        background: var(--bg);
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .sec {
        margin-top: 56px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .sec > header {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-width: 62ch;
      }
      main {
        padding-top: 16px;
      }
      [data-view] {
        animation: in 0.25s ease both;
      }
      @keyframes in {
        from {
          opacity: 0.4;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        [data-view] {
          animation: none;
        }
        html {
          scroll-behavior: auto;
        }
      }

      /* hero */
      .hero {
        display: grid;
        grid-template-columns: 1.25fr 0.75fr;
        gap: 24px;
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 40px;
        padding: clamp(24px, 5vw, 56px);
      }
      .hero-t {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 0;
      }
      .lead {
        font-size: 1.1rem;
        color: var(--muted);
        max-width: 52ch;
      }
      .cta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .hero-i {
        background: var(--green-l);
        border-radius: 36px;
        aspect-ratio: 1/0.9;
        display: grid;
        place-items: center;
        max-width: 100%;
        padding: 18px;
      }
      .hero-i svg {
        width: 100%;
        max-width: 320px;
        height: auto;
      }
      @media (max-width: 820px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .hero-i {
          order: -1;
          aspect-ratio: auto;
          padding: 12px;
        }
        .hero-i svg {
          max-width: 200px;
        }
      }
      .facts .card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 20px;
      }
      .facts b {
        font: 700 1.7rem var(--f-display);
        color: var(--link);
      }
      .steps {
        counter-reset: s;
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
      }
      .step {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-l);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .step .n {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--green);
        color: var(--on-green);
        display: grid;
        place-items: center;
        font: 700 1rem var(--f-display);
      }

      /* education */
      .sign-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      }
      .sign {
        display: flex;
        gap: 18px;
        align-items: center;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-l);
        padding: 18px;
      }
      .sign svg {
        flex: none;
        width: 76px;
        height: 76px;
      }
      .sign div {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sign .eg {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .apd {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
      }
      .apd-i {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .apd-i .pill {
        align-self: flex-start;
      }
      .hier {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .hier-i {
        border-radius: 20px;
        padding: 14px 20px;
        background: var(--green);
        color: var(--on-green);
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .hier-i b {
        font: 700 1.05rem var(--f-display);
      }
      .hier-i span {
        font-size: 0.88rem;
        opacity: 0.92;
      }
      .hier-i.l2 {
        background: #3aa96a;
        color: #07301a;
      }
      .hier-i.l3 {
        background: #63bc88;
        color: #07301a;
      }
      .hier-i.l4 {
        background: #96d3ae;
        color: #07301a;
      }
      .hier-i.l5 {
        background: #c4e8d2;
        color: #07301a;
      }
      .tri {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
      }
      .tri > div {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .cls {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cls-i {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 14px;
        align-items: center;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        padding: 14px 16px;
      }
      .cls-i .k {
        width: 52px;
        height: 52px;
        border-radius: 18px;
        background: var(--green);
        color: var(--on-green);
        display: grid;
        place-items: center;
        font: 700 1.4rem var(--f-display);
      }
      .cls-i div {
        min-width: 0;
      }
      .law {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .law-i {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .pass {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
      }
      .pass > div {
        background: var(--surface-2);
        border-radius: var(--r-m);
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .pass b {
        font: 700 1.5rem var(--f-display);
        color: var(--link);
      }
      .q {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-l);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .opts {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .opt {
        font: 500 0.95rem var(--f-body);
        text-align: left;
        padding: 12px 18px;
        border-radius: 18px;
        border: 1.5px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      .opt:hover:not([disabled]) {
        background: var(--surface-2);
      }
      .opt.right {
        background: var(--ok-bg);
        border-color: var(--green);
        color: var(--ok-fg);
        font-weight: 700;
      }
      .opt.wrong {
        background: var(--bad-bg);
        border-color: var(--bad-fg);
        color: var(--bad-fg);
      }
      .opt[disabled] {
        cursor: default;
      }
      .expl {
        font-size: 0.9rem;
        background: var(--surface);
        border-radius: 16px;
        padding: 12px 16px;
      }

      /* report form */
      .two {
        display: grid;
        gap: 20px;
        grid-template-columns: 1.35fr 1fr;
        align-items: start;
      }
      @media (max-width: 900px) {
        .two {
          grid-template-columns: 1fr;
        }
      }
      .frow {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      }
      .sev {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .sev input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .sev label {
        padding: 9px 18px;
        border-radius: 999px;
        border: 1.5px solid var(--line);
        font-weight: 600;
        font-size: 0.88rem;
        cursor: pointer;
        background: var(--bg);
      }
      .sev input:checked + label {
        background: var(--green);
        border-color: var(--green);
        color: var(--on-green);
      }
      .sev input:focus-visible + label {
        outline: 3px solid var(--ring);
        outline-offset: 2px;
      }
      .ok-box {
        background: var(--ok-bg);
        color: var(--ok-fg);
        border-radius: var(--r-m);
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .alert112 {
        display: flex;
        gap: 14px;
        align-items: center;
        background: var(--bad-bg);
        color: var(--bad-fg);
        border-radius: var(--r-m);
        padding: 16px 18px;
      }
      .alert112 b {
        font: 700 1.7rem var(--f-display);
      }
      .my {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .my-i {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .my-i .line {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .note {
        font-size: 0.85rem;
        background: var(--surface);
        border-radius: 14px;

            '<div id="rf-err" class="err" hidden></div>' +

            '<div class="stack"><div class="alert112"><b>112</b><span>Ada korban atau api? Hubungi bantuan darurat dan beri pertolongan pertama lebih dulu, baru isi form ini.</span></div><div class="card"><h3 style="margin-bottom:14px">Laporan saya</h3><div id="my">' +
            myList() +
            "</div></div></div></div></div>";
          renderPhotos();
        }

        function counts() {
          var c = {};
          STATUS_KEYS.forEach(function (k) {
            c[k] = 0;
          });
          state.reports.forEach(function (r) {
            c[r.status]++;
          });
          return c;
        }
        function renderKelola() {
          var el = $("#v-kelola");
          if (!isAdmin()) {
            el.innerHTML = me()
              ? gate(
                  "Khusus admin",
                  "Halaman ini hanya dapat dibuka oleh akun Admin K3.",
                  '<button class="btn" data-act="logout">Keluar dan ganti akun</button>',
                )
              : gate(
                  "Masuk sebagai admin",
                  "Gunakan akun demo Admin K3 untuk menindaklanjuti laporan.",
                  '<button class="btn" data-act="login">Masuk</button>',
                );
            return;
          }
          var c = counts(),
            total = state.reports.length;
          var chips = [["semua", "Semua", total]].concat(
            STATUS_KEYS.map(function (k) {
              return [k, STATUS[k][0], c[k]];
            }),
          );
          el.innerHTML =
            '<div class="sec" style="margin-top:24px"><header><p class="eyebrow">Panel admin</p><h1 style="font-size:clamp(1.9rem,4.4vw,2.8rem)">Kelola laporan kecelakaan kerja</h1></header>' +
            '<div class="tiles"><div class="tile"><span class="muted">Total laporan</span><b>' +
            total +
            '</b></div><div class="tile' +
            (c.baru ? " hot" : "") +
            '"><span>Perlu ditinjau</span><b>' +
            c.baru +
            '</b></div><div class="tile"><span class="muted">Sedang diproses</span><b>' +
            (c.verifikasi + c.proses) +
            '</b></div><div class="tile"><span class="muted">Selesai</span><b>' +
            c.selesai +
            "</b></div></div>" +
            '<div class="tools"><div class="chips">' +
            chips
              .map(function (x) {
                return (
                  '<button class="chip' +
                  (fStatus === x[0] ? " on" : "") +
                  '" data-act="filter" data-s="' +
                  x[0] +
                  '">' +
                  x[1] +
                  "<small>" +
                  x[2] +
                  "</small></button>"
                );
              })
              .join("") +
            '</div><div class="search"><input id="kq" type="search" placeholder="Cari nomor, lokasi, atau pelapor" aria-label="Cari laporan" value="' +
            esc(fQ) +
            '"></div></div>' +
            '<div id="klist" class="list"></div><div><button class="btn ghost sm" data-act="reset-demo">Reset data demo</button></div></div>';
          renderKList();
        }
        function renderKList() {
          var q = fQ.trim().toLowerCase();
          var L = state.reports
            .filter(function (r) {
              if (fStatus !== "semua" && r.status !== fStatus) return false;
              return (
                !q ||
                (
                  r.id +
                  " " +
                  r.location +
                  " " +
                  r.reporter.name +
                  " " +
                  r.type +
                  " " +
                  r.desc
                )
                  .toLowerCase()
                  .indexOf(q) > -1
              );
            })
            .sort(function (a, b) {
              return b.createdAt.localeCompare(a.createdAt);
            });
          $("#klist").innerHTML = L.length
            ? L.map(function (r) {
                return (
                  '<button class="row" data-act="open" data-id="' +
                  esc(r.id) +
                  '"><span class="main"><span class="mono">' +
                  esc(r.id) +
                  (r.demo ? " · contoh" : "") +
                  "</span><b>" +
                  esc(r.location) +
                  " — " +
                  esc(r.type) +
                  '</b><span class="meta">' +
                  esc(fmt(r.when)) +
                  " · Pelapor: " +
                  esc(r.reporter.name) +
                  (r.photos && r.photos.length
                    ? " · " + r.photos.length + " foto"
                    : "") +
                  (r.pic ? " · PJ: " + esc(r.pic) : "") +
                  '</span></span><span class="pills">' +
                  pill(SEV, r.severity) +
                  pill(STATUS, r.status) +
                  "</span></button>"
                );
              }).join("")
            : '<div class="empty">Tidak ada laporan yang cocok.</div>';
        }

        /* ---------- dialogs ---------- */
        function closeDlg() {
          dlg.innerHTML = "";
          openId = null;
          if (lastFocus && lastFocus.focus) {
            try {
              lastFocus.focus();
            } catch (e) {}
          }
        }
        function openLogin() {
          lastFocus = document.activeElement;
          dlg.innerHTML =
            '<div class="overlay" data-overlay="1"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lt"><div class="sheet-h"><div><p class="eyebrow">Akun demo</p><h2 id="lt">Masuk</h2></div><button class="icon-btn" data-act="close-dlg" aria-label="Tutup">×</button></div>' +
            '<p class="muted">Pilih akun demo untuk mengisi form otomatis.</p>' +
            accountsHtml() +
            '<form id="lf" class="stack" novalidate><div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" placeholder="admin@selamatk3.demo"></div><div class="field"><label for="l-pass">Kata sandi</label><input id="l-pass" type="password" autocomplete="current-password"></div><div id="l-err" class="err" hidden></div><div><button class="btn" type="submit">Masuk</button></div></form></div></div>';
          var f = $("#l-email");
          if (f) f.focus();
        }
        function openDetail(id) {
          var r = state.reports.filter(function (x) {
            return x.id === id;
          })[0];
          if (!r) return;
          lastFocus = document.activeElement;
          openId = id;
          dlg.innerHTML =
            '<div class="overlay" data-overlay="1"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dt">' +
            '<div class="sheet-h"><div><p class="mono">' +
            esc(r.id) +
            (r.demo ? " · contoh data" : "") +
            '</p><h2 id="dt">' +
            esc(r.location) +
            '</h2><div class="chips" style="margin-top:8px">' +
            pill(STATUS, r.status) +
            pill(SEV, r.severity) +
            '<span class="pill p-mute">' +
            esc(r.type) +
            '</span></div></div><button class="icon-btn" data-act="close-dlg" aria-label="Tutup">×</button></div>' +
            '<div class="kv"><div><small>Waktu kejadian</small><span>' +
            esc(fmt(r.when)) +
            "</span></div><div><small>Pelapor</small><span>" +
            esc(r.reporter.name) +
            "</span></div><div><small>Dilaporkan</small><span>" +
            esc(fmt(r.createdAt)) +
            "</span></div><div><small>Korban</small><span>" +
            esc(r.victim || "-") +
            "</span></div></div>" +
            '<div><p class="lbl" style="margin-bottom:6px">Kronologi</p><div class="desc">' +
            esc(r.desc) +
            "</div></div>" +
            (r.action
              ? '<div><p class="lbl" style="margin-bottom:6px">Tindakan awal dari pelapor</p><div class="desc">' +
                esc(r.action) +
                "</div></div>"
              : "") +
            (r.photos && r.photos.length
              ? '<div><p class="lbl" style="margin-bottom:8px">Foto pendukung</p><div class="gal">' +
                r.photos
                  .map(function (p, i) {
                    return (
                      '<button type="button" data-act="zoom" data-id="' +
                      esc(r.id) +
                      '" data-i="' +
                      i +
                      '" aria-label="Perbesar foto ' +
                      (i + 1) +
                      '"><img src="' +
                      esc(p) +
                      '" alt="Foto pendukung ' +
                      (i + 1) +
                      '"></button>'
                    );
                  })
                  .join("") +
                "</div></div>"
              : "") +
            '<form id="df" class="card stack" novalidate><h3>Tindak lanjut</h3><div class="frow"><div class="field"><label for="d-status">Status</label><select id="d-status">' +
            STATUS_KEYS.map(function (k) {
              return (
                '<option value="' +
                k +
                '"' +
                (r.status === k ? " selected" : "") +
                ">" +
                STATUS[k][0] +
                "</option>"
              );
            }).join("") +
            '</select></div><div class="field"><label for="d-pic">Penanggung jawab</label><input id="d-pic" type="text" maxlength="80" value="' +
            esc(r.pic) +
            '" placeholder="Nama petugas atau supervisor"></div></div>' +
            '<div class="field"><label for="d-target">Target selesai</label><input id="d-target" type="date" value="' +
            esc(r.target || "") +
            '"></div>' +
            '<div class="field"><label for="d-note">Catatan atau tindakan korektif</label><textarea id="d-note" maxlength="800" placeholder="Hasil pemeriksaan, penyebab, dan langkah perbaikan."></textarea><span class="hint">Catatan wajib diisi sebelum status diubah menjadi Selesai.</span></div>' +
            '<div id="d-err" class="err" hidden></div><div><button class="btn" type="submit">Simpan tindak lanjut</button></div></form>' +
            '<div><p class="lbl" style="margin-bottom:10px">Riwayat</p><div class="tl">' +
            r.logs
              .slice()
              .reverse()
              .map(function (l) {
                return (
                  '<div class="tl-i"><i></i><div><span>' +
                  pill(STATUS, l.status) +
                  ' <span class="muted" style="font-size:.8rem">' +
                  esc(fmt(l.at)) +
                  " · " +
                  esc(l.by) +
                  "</span></span><span>" +
                  esc(l.text) +
                  "</span></div></div>"
                );
              })
              .join("") +
            "</div></div>" +
            "</div></div>";
          var c = $(".icon-btn", dlg);
          if (c) c.focus();
        }

        /* ---------- photos ---------- */
        var formPhotos = [],
          MAXPH = 3;
        function phMsg(t) {
          var m = $("#ph-msg");
          if (m) m.textContent = t;
        }
        function renderPhotos() {
          var box = $("#ph-list");
          if (!box) return;
          box.innerHTML = formPhotos
            .map(function (p, i) {
              return (
                '<div class="ph"><img src="' +
                esc(p) +
                '" alt="Foto ' +
                (i + 1) +
                '"><button type="button" data-act="rm-photo" data-i="' +
                i +
                '" aria-label="Hapus foto ' +
                (i + 1) +
                '">×</button></div>'
              );
            })
            .join("");
          var full = formPhotos.length >= MAXPH;
          ["pick-cam", "pick-gal"].forEach(function (a) {
            var b = $('[data-act="' + a + '"]');
            if (b) b.disabled = full;
          });
        }
        function compress(file) {
          return new Promise(function (res, rej) {
            var url = URL.createObjectURL(file),
              img = new Image();
            img.onload = function () {
              var max = 1280,
                w = img.naturalWidth,
                h = img.naturalHeight,
                k = Math.min(1, max / Math.max(w, h));
              var c = document.createElement("canvas");
              c.width = Math.max(1, Math.round(w * k));
              c.height = Math.max(1, Math.round(h * k));
              var x = c.getContext("2d");
              x.fillStyle = "#fff";
              x.fillRect(0, 0, c.width, c.height);
              x.drawImage(img, 0, 0, c.width, c.height);
              URL.revokeObjectURL(url);
              try {
                res(c.toDataURL("image/jpeg", 0.72));
              } catch (e) {
                rej(e);
              }
            };
            img.onerror = function () {
              URL.revokeObjectURL(url);
              rej(new Error("decode"));
            };
            img.src = url;
          });
        }
        function addFiles(list) {
          var all = Array.prototype.slice.call(list || []);
          var files = all.filter(function (f) {
            return /^image\//.test(f.type) && f.size <= 25 * 1024 * 1024;
          });
          if (!files.length) {
            if (all.length)
              phMsg(
                "Pilih berkas gambar (JPG, PNG, atau WebP) dengan ukuran di bawah 25 MB.",
              );
            return;
          }
          var room = MAXPH - formPhotos.length,
            cut = files.length > room,
            failed = false;
          files = files.slice(0, room);
          phMsg("Memproses foto...");
          files
            .reduce(function (p, f) {
              return p.then(function () {
                return compress(f).then(
                  function (d) {
                    formPhotos.push(d);
                    renderPhotos();
                  },
                  function () {
                    failed = true;
                  },
                );
              });
            }, Promise.resolve())
            .then(function () {
              phMsg(
                failed
                  ? "Ada foto yang tidak bisa dibaca. Coba format JPG atau PNG."
                  : cut
                    ? "Maksimal " +
                      MAXPH +
                      " foto. Sebagian foto tidak ditambahkan."
                    : formPhotos.length + " foto siap dikirim.",
              );
            });
        }
        function openLb(src) {
          $("#lb").innerHTML =
            '<div class="overlay lb" data-act="close-lb" role="dialog" aria-modal="true" aria-label="Pratinjau foto"><div style="display:flex;flex-direction:column;gap:14px;align-items:center;max-width:100%;margin:auto"><img src="' +
            esc(src) +
            '" alt="Foto pendukung diperbesar"><button type="button" class="btn sm" data-act="close-lb">Tutup</button></div></div>';
        }
        function closeLb() {
          $("#lb").innerHTML = "";
        }

        /* ---------- router ---------- */
        function route() {
          var h = (location.hash || "").slice(1);
          cur = VIEWS.indexOf(h) > -1 ? h : "beranda";
          VIEWS.forEach(function (v) {
            $("#v-" + v).hidden = v !== cur;
          });
          renderHeader();
          if (cur === "beranda") renderHome();
          else if (cur === "edukasi") renderEdu();
          else if (cur === "lapor") renderLapor();
          else renderKelola();
          window.scrollTo(0, 0);
        }
        window.addEventListener("hashchange", route);
        function rerender() {
          var y = window.scrollY;
          renderHeader();
          if (cur === "beranda") renderHome();
          else if (cur === "edukasi") renderEdu();
          else if (cur === "lapor") renderLapor();
          else renderKelola();
          window.scrollTo(0, y);
        }

        /* ---------- events ---------- */
        document.addEventListener("click", function (e) {
          var ov = e.target.closest && e.target.closest("[data-overlay]");
          if (ov && e.target === ov) {
            closeDlg();
            return;
          }
          var a = e.target.closest("[data-act]");
          if (!a) return;
          var act = a.dataset.act;
          if (act === "login") {
            openLogin();
          } else if (act === "login-fill") {
            openLogin();
            fill(+a.dataset.i);
          } else if (act === "fill") {
            fill(+a.dataset.i);
          } else if (act === "close-dlg") {
            closeDlg();
          } else if (act === "theme") {
            toggleTheme();
          } else if (act === "pick-cam") {
            var ci = $("#f-cam");
            if (ci) ci.click();
          } else if (act === "pick-gal") {
            var gi = $("#f-gal");
            if (gi) gi.click();
          } else if (act === "rm-photo") {
            formPhotos.splice(+a.dataset.i, 1);
            renderPhotos();
            phMsg(
              formPhotos.length
                ? formPhotos.length + " foto siap dikirim."
                : "Foto dihapus.",
            );
          } else if (act === "zoom") {
            var zr = state.reports.filter(function (x) {
              return x.id === a.dataset.id;
            })[0];
            if (zr && zr.photos && zr.photos[+a.dataset.i])
              openLb(zr.photos[+a.dataset.i]);
          } else if (act === "close-lb") {
            closeLb();
          } else if (act === "logout") {
            state.session = null;
            lastDone = null;
            save();
            if (cur === "kelola" && false) {
            }
            rerender();
            toast("Anda sudah keluar.");
          } else if (act === "tab") {
            eduTab = a.dataset.t;
            renderEdu();
          } else if (act === "quiz") {
            quiz[+a.dataset.q] = +a.dataset.o;
            var y = window.scrollY;
            renderEdu();
            window.scrollTo(0, y);
          } else if (act === "quiz-reset") {
            quiz = {};
            renderEdu();
          } else if (act === "filter") {
            fStatus = a.dataset.s;
            renderKelola();
          } else if (act === "open") {
            openDetail(a.dataset.id);
          } else if (act === "reset-demo") {
            state = seed();
            save();
            closeDlg();
            rerender();
            toast("Data demo dikembalikan.");
          }
        });
        function fill(i) {
          var acc = ACCOUNTS[i];
          if (!acc) return;
          $("#l-email").value = acc.email;
          $("#l-pass").value = acc.pass;
          $("#l-pass").focus();
        }
        document.addEventListener("keydown", function (e) {
          if (e.key !== "Escape") return;
          if ($("#lb").innerHTML) closeLb();
          else if (dlg.innerHTML) closeDlg();
        });
        document.addEventListener("change", function (e) {
          var t = e.target;
          if (!t || (t.id !== "f-cam" && t.id !== "f-gal")) return;
          addFiles(t.files);
          t.value = "";
        });
        try {
          window
            .matchMedia("(prefers-color-scheme: dark)")
            .addEventListener("change", function () {
              renderHeader();
            });
        } catch (e) {}
        document.addEventListener("input", function (e) {
          if (e.target && e.target.id === "kq") {
            fQ = e.target.value;
            renderKList();
          }
        });

        document.addEventListener("submit", function (e) {
          e.preventDefault();
          var id = e.target.id;
          if (id === "lf") {
            var em = $("#l-email").value.trim().toLowerCase(),
              pw = $("#l-pass").value,
              box = $("#l-err");
            var acc = ACCOUNTS.filter(function (a) {
              return a.email === em && a.pass === pw;
            })[0];
            if (!acc) {
              box.hidden = false;
              box.textContent =
                "Email atau kata sandi tidak cocok. Pilih salah satu akun demo di atas.";
              return;
            }
            state.session = {
              email: acc.email,
              name: acc.name,
              role: acc.role,
              label: acc.label,
            };
            save();
            closeDlg();
            if (acc.role === "admin" && cur === "beranda") {
              location.hash = "#kelola";
            } else {
              rerender();
            }
            toast("Selamat datang, " + acc.name.split(" ")[0] + ".");
          } else if (id === "rf") {
            var when = $("#f-when").value,
              loc = $("#f-loc").value.trim(),
              desc = $("#f-desc").value.trim(),
              box2 = $("#rf-err");
            var err = !when
              ? "Isi waktu kejadian."
              : !loc
                ? "Isi lokasi kejadian."
                : desc.length < 15
                  ? "Kronologi minimal 15 karakter agar admin dapat memahami kejadiannya."
                  : "";
            if (err) {
              box2.hidden = false;
              box2.textContent = err;
              return;
            }
            var n = ++state.seq,
              rid =
                "LK-" +
                new Date().getFullYear() +
                "-" +
                String(n).padStart(4, "0"),
              s = me(),
              nowI = new Date().toISOString();
            state.reports.push({
              id: rid,
              createdAt: nowI,
              when: new Date(when).toISOString(),
              reporter: { email: s.email, name: s.name },
              location: loc,
              type: $("#f-type").value,
              severity:
                (document.querySelector('input[name="sev"]:checked') || {})
                  .value || "ringan",
              victim: $("#f-victim").value.trim(),
              desc: desc,
              action: $("#f-act").value.trim(),
              photos: formPhotos.slice(),
              status: "baru",
              pic: "",
              target: "",
              logs: [
                {
                  at: nowI,
                  by: s.name,
                  status: "baru",
                  text: "Laporan diterima.",
                },
              ],
            });
            var dropped = false,
              rep = state.reports[state.reports.length - 1];
            if (!save() && rep.photos.length) {
              rep.photos = [];
              dropped = true;
              save();
            }
            lastDone = rid;
            renderLapor();
            window.scrollTo(0, 0);
            toast(
              dropped
                ? "Laporan " +
                    rid +
                    " terkirim, tetapi foto tidak tersimpan (penyimpanan peramban penuh)."
                : "Laporan " + rid + " terkirim.",
            );
          } else if (id === "df") {
            var r = state.reports.filter(function (x) {
              return x.id === openId;
            })[0];
            if (!r) return;
            var st = $("#d-status").value,
              pic = $("#d-pic").value.trim(),
              tg = $("#d-target").value,
              note = $("#d-note").value.trim(),
              b = $("#d-err");
            if (st === "selesai" && !note && r.status !== "selesai") {
              b.hidden = false;
              b.textContent =
                "Isi catatan tindakan korektif sebelum menandai laporan selesai.";
              return;
            }
            var changed =
              st !== r.status ||
              pic !== r.pic ||
              tg !== (r.target || "") ||
              note;
            if (!changed) {
              b.hidden = false;
              b.textContent = "Belum ada perubahan untuk disimpan.";
              return;
            }
            var parts = [];
            if (st !== r.status)
              parts.push("Status diubah ke " + STATUS[st][0] + ".");
            if (pic !== r.pic)
              parts.push("Penanggung jawab: " + (pic || "dikosongkan") + ".");
            if (tg !== (r.target || ""))
              parts.push(
                "Target selesai: " + (tg ? fmtD(tg) : "dihapus") + ".",
              );
            if (note) parts.push(note);
            r.status = st;
            r.pic = pic;
            r.target = tg;
            r.logs.push({
              at: new Date().toISOString(),
              by: me().name,
              status: st,
              text: parts.join(" "),
            });
            save();
            openDetail(r.id);
            renderKelola();
            toast("Tindak lanjut disimpan.");
          }
        });

        route();
      })();
    </script>
  </body>
</html>
